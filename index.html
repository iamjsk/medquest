<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>의학용어 퀘스트</title>
<meta name="theme-color" content="#0A0F24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="메디퀘스트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Lexend:wght@500;700;800&display=swap">
<style>
/* Layout: one-column game shell, monitor-screen night palette; ECG trace as the recurring motif */
:root{
  --bg:#0A0F24; --surface:#131A3A; --surface2:#1B2452; --line:#2A3570;
  --fg:#EEF1FF; --muted:#8C96C8;
  --cyan:#33E1F2; --pink:#FF4F8B; --gold:#FFC857; --good:#3EE58A; --bad:#FF5C6A;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-term:"Lexend","Avenir Next","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.term{font-family:var(--f-term);font-weight:700;letter-spacing:-.01em}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.top h1{font-size:24px}
.top h1 span{color:var(--cyan)}
.lvl{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);padding:6px 12px 6px 6px;border-radius:999px}
.lvl b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--pink));color:var(--bg);font-family:var(--f-term);font-size:14px}
.ecg{width:100%;height:44px;display:block}
.ecg path{fill:none;stroke:var(--cyan);stroke-width:2;stroke-linejoin:round;stroke-dasharray:600;stroke-dashoffset:600;animation:trace 2.4s linear infinite;filter:drop-shadow(0 0 4px var(--cyan))}
@keyframes trace{to{stroke-dashoffset:-600}}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-term);font-weight:800;font-size:24px;line-height:1.1}
.stat .k{font-size:12px;color:var(--muted)}
.flame{color:var(--gold)}
.xpbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:99px;transition:width .6s}

/* Rx mission card */
.rx{position:relative;border-radius:22px;padding:20px;background:
  radial-gradient(120% 90% at 100% 0%,rgba(255,79,139,.28),transparent 60%),
  radial-gradient(100% 80% at 0% 100%,rgba(51,225,242,.22),transparent 60%),var(--surface2);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;gap:14px}
.rx .rxmark{position:absolute;right:16px;top:8px;font-family:var(--f-term);font-weight:800;font-size:64px;color:rgba(255,255,255,.06);line-height:1}
.rx h2{font-size:26px}
.rx .lines{display:flex;flex-direction:column;gap:6px}
.rx .ln{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:6px}
.rx .ln b{font-family:var(--f-term);font-size:18px}
.done-stamp{align-self:flex-start;font-family:var(--f-display);color:var(--good);border:2px solid var(--good);border-radius:8px;padding:2px 10px;transform:rotate(-4deg)}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:16px;font-family:var(--f-display);font-size:20px;background:linear-gradient(135deg,var(--cyan),#5B8CFF);color:#06122A;box-shadow:0 6px 0 #1E3C8C,0 10px 24px rgba(51,225,242,.25);transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #1E3C8C}
.big.alt{background:var(--surface);color:var(--fg);box-shadow:0 5px 0 #070B1C;border:1px solid var(--line)}
.big.pink{background:linear-gradient(135deg,var(--pink),#FF8A5B);color:#2A0612;box-shadow:0 6px 0 #8C1E44}
.big[disabled]{opacity:.45;pointer-events:none}

.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.row>div{min-width:0;flex:1}
.banner{border-radius:14px;padding:12px 14px;background:rgba(255,200,87,.12);border:1px solid rgba(255,200,87,.4);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{color:var(--gold);font-weight:700;white-space:nowrap}

/* boss card */
.bosscard{display:flex;gap:14px;align-items:center}
.bosscard svg{flex:none}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.on{background:rgba(255,79,139,.18);color:var(--pink)}
.pill.ok{background:rgba(62,229,138,.15);color:var(--good)}

/* milestones */
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-term);font-weight:800;font-size:14px;background:var(--surface2);color:var(--muted);border:1px dashed var(--line)}
.badge.got{background:linear-gradient(135deg,var(--gold),#FF9A3D);color:#2A1600;border:0;box-shadow:0 0 16px rgba(255,200,87,.35)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,15,36,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{padding:10px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--cyan)}

/* map */
.world{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border-radius:18px;padding:14px;border:1px solid transparent}
.world.locked{opacity:.45}
.world.current{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(51,225,242,.12)}
.orb{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;color:#08102A}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.stage-h{margin-top:6px}
.wlist{display:flex;flex-direction:column;gap:6px}
.witem{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px}
.witem .term{font-size:16px}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface2)}
.dots i.f{background:var(--cyan)}

/* word book */
.search{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--f-body)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:none;padding:8px 14px;border-radius:99px;background:var(--surface);font-size:14px;font-weight:700;color:var(--muted);border:1px solid var(--line)}
.filters button[aria-pressed="true"]{background:var(--cyan);color:#06122A;border-color:var(--cyan)}
.bitem{background:var(--surface);border-radius:14px;overflow:hidden}
.bhead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;text-align:left}
.bhead>div{min-width:0}
.bbody{padding:0 12px 14px;display:flex;flex-direction:column;gap:10px;animation:up .2s}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
/* settings */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:12px 0;border-radius:12px;background:var(--surface2);font-family:var(--f-term);font-weight:700;font-size:18px}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#06122A}
textarea{width:100%;min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
.btn{padding:11px 14px;border-radius:12px;background:var(--surface2);font-weight:700}
.btn.warn{color:var(--bad)}
.toggle{width:52px;height:30px;border-radius:99px;background:var(--surface2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .2s}
.toggle[aria-pressed="true"]{background:var(--cyan)}
.toggle[aria-pressed="true"]::after{transform:translateX(22px);background:#06122A}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* overlay (session / boss / world) */
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov-in{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-top{display:flex;align-items:center;gap:12px}
.x{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none}
.prog{flex:1;height:12px;border-radius:99px;background:var(--surface);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--cyan));border-radius:99px;transition:width .35s}
.combo{font-family:var(--f-term);font-weight:800;color:var(--gold);min-width:56px;text-align:right}
.combo.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.45)}}

/* learn card */
.learn{border-radius:24px;padding:22px 20px;background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;animation:flipin .45s cubic-bezier(.2,.8,.3,1.2)}
@keyframes flipin{from{transform:perspective(800px) rotateY(-70deg);opacity:0}}
.newtag{align-self:flex-start;font-size:12px;font-weight:700;color:var(--bg);background:var(--pink);padding:3px 10px;border-radius:99px}
.bigterm{font-size:clamp(28px,9vw,40px);line-height:1.1;overflow-wrap:anywhere}
.pron{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pron span{font-size:18px;font-weight:700;color:var(--cyan)}
.spk{width:44px;height:44px;border-radius:50%;background:rgba(51,225,242,.14);color:var(--cyan);display:grid;place-items:center;flex:none}
.spk svg{width:22px;height:22px}
.spk.sm{width:34px;height:34px}.spk.sm svg{width:17px;height:17px}
.meaning{font-size:22px;font-weight:700}
.parts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.chip b{font-family:var(--f-term);font-size:16px}
.chip small{font-size:11px;color:var(--muted)}
.chip.c0 b{color:var(--cyan)}.chip.c1 b{color:var(--pink)}.chip.c2 b{color:var(--gold)}.chip.c3 b{color:var(--good)}
.chip.join{padding:6px 4px;border:0;background:none}
.plus{color:var(--muted)}
.ex{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px}
.ex div{min-width:0}

/* question */
.qbox{display:flex;flex-direction:column;gap:14px}
.qprompt{border-radius:22px;padding:22px 18px;background:var(--surface);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.qprompt .bigterm{font-size:clamp(26px,8vw,36px)}
.qtype{font-size:13px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:15px 16px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-size:17px;font-weight:500;box-shadow:0 4px 0 #070B1C;transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #070B1C}
.opt.term{font-size:18px}
.opt.right{border-color:var(--good);background:rgba(62,229,138,.14);animation:pop .3s}
.opt.wrong{border-color:var(--bad);background:rgba(255,92,106,.14);animation:shake .35s}
.opt[disabled]{pointer-events:none}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.spell{display:flex;gap:8px}
.spell input{flex:1;min-width:0;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:700 20px var(--f-term)}
.spell input.right{border-color:var(--good)}.spell input.wrong{border-color:var(--bad);animation:shake .35s}
.fb{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;animation:up .25s}
.fb.bad{background:rgba(255,92,106,.1);border:1px solid rgba(255,92,106,.4)}
.fb.good{background:rgba(62,229,138,.1);border:1px solid rgba(62,229,138,.4)}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:60;animation:fl .4s forwards}
@keyframes fl{from{opacity:.35}to{opacity:0}}

/* result */
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:24px}
.result h2{font-size:34px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}

/* boss */
.arena{position:relative;border-radius:24px;padding:18px;background:radial-gradient(80% 70% at 50% 40%,rgba(255,79,139,.25),transparent 70%),var(--surface);display:flex;flex-direction:column;align-items:center;gap:8px}
.bossname{font-family:var(--f-display);font-size:20px}
.hp{width:100%;height:14px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--pink));transition:width .4s}
.hearts{display:flex;gap:4px;color:var(--pink)}
.hearts svg{width:22px;height:22px}
.hearts .lost{color:var(--surface2)}
.bossart{animation:bob 2.2s ease-in-out infinite}
.bossart.hit{animation:hit .4s}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hit{20%{transform:translateX(-10px) rotate(-6deg);filter:brightness(2)}60%{transform:translateX(8px) rotate(4deg)}}
.dmg{position:absolute;top:30%;left:50%;font-family:var(--f-term);font-weight:800;font-size:30px;color:var(--gold);animation:dmg .8s forwards;pointer-events:none}
@keyframes dmg{to{transform:translate(-50%,-50px);opacity:0}}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;background:var(--surface2);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .25s;max-width:calc(100% - 32px);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" aria-label="메뉴"><div>
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2-5 4 10 3-7 2 2h5"/></svg>오늘</button>
  <button data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>월드맵</button>
  <button data-tab="book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 7h7M9 11h5"/></svg>단어장</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
</div></nav>
<div class="ov" id="ov" hidden><div class="ov-in" id="ovin"></div></div>
<canvas id="fx"></canvas>

<script>
/* ===================== 단어 데이터 =====================
   [용어, 한글 발음, 뜻, 조각(조각=뜻|...), 예시·현장 한마디, (선택)읽기용 텍스트] */
const WORLDS = [
{id:"pre",stage:"입학 전 워밍업",name:"접두사 던전",tag:"앞",color:"#33E1F2",desc:"단어 맨 앞에 붙는 조각",items:[
["a-/an-","어 · 언","없음, ~이 아닌","an=없음|emia=혈액 상태","anemia 어니미아 · 빈혈","a, an"],
["anti-","앤티","반대, 대항","anti=대항|bio=생명|tic=~의","antibiotic 앤티바이오틱 · 항생제"],
["brady-","브래디","느린","brady=느린|card=심장|ia=상태","bradycardia 브래디카디아 · 서맥"],
["tachy-","태키","빠른","tachy=빠른|card=심장|ia=상태","tachycardia 태키카디아 · 빈맥"],

function today(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)}
const isWord=x=>x.w>=3;

let storageOK=true;
function fresh(){return{v:1,daily:1,sound:true,words:{},xp:0,streak:0,lastDone:null,day:{n:today(),newDone:0,revDone:0,done:false},boss:{},badges:[],lastBackup:null,start:today()}}
function load(){try{const r=localStorage.getItem(KEY);if(r){return Object.assign(fresh(),JSON.parse(r))}}catch(e){storageOK=false}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}
let S=load();
function ensureDay(){if(!S.day||S.day.n!==today())S.day={n:today(),newDone:0,revDone:0,done:false}}

const learned=()=>Object.keys(S.words).length;
const mastered=()=>Object.values(S.words).filter(w=>w.b>=MASTER).length;
const streakNow=()=>S.lastDone!=null&&S.lastDone>=today()-1?S.streak:0;
function nextNew(n){const r=[];for(const x of ALL){if(r.length>=n)break;if(!S.words[x.t])r.push(x)}return r}
function dueList(){const t=today();return Object.entries(S.words).filter(([k,w])=>w.due<=t&&BY[k]).sort((a,b)=>a[1].due-b[1].due).slice(0,20).map(([k])=>BY[k])}
function lvlOf(xp){let L=1;while(xp>=50*L*(L+1))L++;return L}
function lvlProg(xp){const L=lvlOf(xp),lo=L>1?50*(L-1)*L:0,hi=50*L*(L+1);return{L,pct:Math.round((xp-lo)/(hi-lo)*100),need:hi-xp}}

let AC=null;
function tone(seq){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;seq.forEach(([f,st,du,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+st);g.gain.exponentialRampToValueAtTime(.18,t0+st+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+st+du);o.connect(g).connect(AC.destination);o.start(t0+st);o.stop(t0+st+du+.02)})}catch(e){}}
const sfx={
  ok:()=>tone([[660,0,.12],[990,.08,.18]]),
  bad:()=>tone([[180,0,.25,"sawtooth"],[140,.1,.25,"sawtooth"]]),
  flip:()=>tone([[520,0,.08]]),
  up:()=>tone([[523,0,.14],[659,.1,.14],[784,.2,.14],[1047,.3,.3]]),
  hit:()=>tone([[300,0,.08,"square"],[120,.05,.2,"square"]])
};
function readText(x){if(x.s)return x.s;return x.t.replace(/\(.*?\)/g,"").split("·").map(s=>s.replace(/[\/\-]/g,"").trim()).join(", ")}
function speak(text){try{const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast("이 기기에서는 발음 듣기가 안 돼요")}}

function confetti(){if(RM)return;const c=$("#fx"),g=c.getContext("2d"),W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";const cols=["#33E1F2","#FF4F8B","#FFC857","#3EE58A","#C08CFF"];const P=Array.from({length:140},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.025-H*.005,r:(4+Math.random()*6)*devicePixelRatio,c:cols[Math.random()*5|0],a:Math.random()*6,va:(Math.random()-.5)*.4}));let f=0;(function tick(){g.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=H*.0009;p.a+=p.va;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);g.restore()});if(++f<110)requestAnimationFrame(tick);else g.clearRect(0,0,W,H)})()}

function ecg(){return '<svg class="ecg" viewBox="0 0 400 44" preserveAspectRatio="none" aria-hidden="true"><path d="M0 26h70l8-6 8 6h30l6 4 8-26 9 38 7-16h30l10-7 12 7h80l8-6 8 6h30l6 4 8-26 9 38 7-16h40"/></svg>'}

function bossInfo(){const d=new Date().getDay(),wk=today()-((d+6)%7);return{open:d===0||d===6,wk,enough:learned()>=5,res:S.boss[wk],name:BOSSES[wk%BOSSES.length]}}
function virus(size,color){return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><g stroke="${color}" stroke-width="5" stroke-linecap="round">${Array.from({length:10},(_,i)=>{const a=i*Math.PI/5,x1=50+Math.cos(a)*30,y1=50+Math.sin(a)*30,x2=50+Math.cos(a)*44,y2=50+Math.sin(a)*44;return`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><circle cx="${x2}" cy="${y2}" r="4" fill="${color}"/>`}).join("")}</g><circle cx="50" cy="50" r="31" fill="${color}"/><circle cx="40" cy="45" r="6" fill="#0A0F24"/><circle cx="60" cy="45" r="6" fill="#0A0F24"/><circle cx="42" cy="43" r="2" fill="#fff"/><circle cx="62" cy="43" r="2" fill="#fff"/><path d="M38 62q12-8 24 0" stroke="#0A0F24" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M33 36l12 5M67 36l-12 5" stroke="#0A0F24" stroke-width="4" stroke-linecap="round"/></svg>`}

/* ===================== 학습 세션 ===================== */
let sess=null;
function typeFor(x){const b=(S.words[x.t]||{b:0}).b;if(!isWord(x))return b>=2?"term":"meaning";return b<=1?"meaning":b===2?"term":"spell"}
function openOv(){$("#ov").hidden=false;$("#ov").scrollTop=0;document.body.style.overflow="hidden"}
function closeOv(){$("#ov").hidden=true;document.body.style.overflow="";render()}

function startSession(bonus){
  ensureDay();
  const n=bonus?S.daily:Math.max(0,S.daily-S.day.newDone);
  const news=nextNew(n),due=dueList();
  if(!news.length&&!due.length){toast("오늘은 할 게 없어요. 푹 쉬어!");return}
  const q=[];news.forEach(x=>{q.push({k:"learn",t:x.t});q.push({k:"q",t:x.t,type:"meaning",isNew:true})});
  shuffle(due).forEach(x=>q.push({k:"q",t:x.t,type:typeFor(x)}));
  sess={q,i:0,combo:0,max:0,right:0,total:0,xp:0,firsts:new Set(),retried:new Set(),L0:learned(),lv0:lvlOf(S.xp),newCount:news.length};
  openOv();step();
}
function head(){const pct=Math.round(sess.i/sess.q.length*100);return`<div class="ov-top"><button class="x" id="quit" aria-label="그만하기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="prog"><i style="width:${pct}%"></i></div><div class="combo num" id="combo">${sess.combo>1?"x"+sess.combo:""}</div></div>`}

function partsHTML(d){return'<div class="parts">'+d.split("|").map((p,i,a)=>{const [k,v]=p.split("=");const plus=i<a.length-1?'<span class="plus">+</span>':"";return(v?`<span class="chip c${i%4}"><b>${esc(k)}</b><small>${esc(v)}</small></span>`:`<span class="chip join"><b class="muted">${esc(k)}</b></span>`)+plus}).join("")+"</div>"}
function exHTML(x){if(!x.e)return"";const m=x.e.match(/^([a-z][a-z\-]*)\s/);return`<div class="ex">${m?`<button class="spk sm" data-say="${esc(m[1])}" aria-label="예시 발음 듣기">${SPK}</button>`:""}<div><div class="label">${isWord(x)?"현장 한마디":"이렇게 쓰여요"}</div><div style="font-size:15px">${esc(x.e)}</div></div></div>`}
function bindSay(root){root.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say))}

function step(){
  if(sess.i>=sess.q.length)return finish();
  const it=sess.q[sess.i],x=BY[it.t],host=$("#ovin");
  if(it.k==="learn"){
    sfx.flip();
    host.innerHTML=head()+`<div class="learn">
      <span class="newtag">NEW · ${isWord(x)?"단어":"조각"}</span>
      <div class="bigterm term">${esc(x.t)}</div>
      <div class="pron"><button class="spk" data-say="${esc(readText(x))}" aria-label="발음 듣기">${SPK}</button><span>${esc(x.p)}</span></div>
      <div class="meaning">${esc(x.m)}</div>
      <div><div class="label" style="margin-bottom:6px">조각 분해</div>${partsHTML(x.d)}</div>
      ${exHTML(x)}
    </div>
    <button class="big" id="next">외웠어! 문제 풀기</button>`;
    bindSay(host);setTimeout(()=>speak(readText(x)),350);
    $("#next").onclick=()=>{sess.i++;step()};
  }else{
    host.innerHTML=head()+'<div id="qh"></div>';
    ask($("#qh"),x,it.type,ok=>onAnswer(it,ok),()=>{sess.i++;step()});
  }
  $("#quit").onclick=()=>finish(true);
}

function opts(x,field){const pool=shuffle(ALL.filter(y=>y.t!==x.t&&y[field]!==x[field]&&(y.w===x.w||Math.abs(y.w-x.w)<=1)));const seen=new Set([x[field]]),r=[x];for(const y of pool){if(r.length>=4)break;if(!seen.has(y[field])){seen.add(y[field]);r.push(y)}}return shuffle(r)}
function norm(s){return s.toLowerCase().replace(/[^a-z0-9]/g,"")}

function ask(host,x,type,onAns,onNext){
  let html="";
  if(type==="meaning"){
    html=`<div class="qprompt"><span class="qtype">이 ${isWord(x)?"단어":"조각"}의 뜻은?</span><div class="bigterm term">${esc(x.t)}</div><div class="pron"><button class="spk sm" data-say="${esc(readText(x))}" aria-label="발음 듣기">${SPK}</button><span style="font-size:15px">${esc(x.p)}</span></div></div><div class="opts">${opts(x,"m").map(y=>`<button class="opt" data-v="${esc(y.t)}">${esc(y.m)}</button>`).join("")}</div>`;
  }else if(type==="term"){
    html=`<div class="qprompt"><span class="qtype">이 뜻의 영어는?</span><div class="meaning" style="font-size:24px">${esc(x.m)}</div></div><div class="opts">${opts(x,"t").map(y=>`<button class="opt term" data-v="${esc(y.t)}">${esc(y.t)}</button>`).join("")}</div>`;
  }else{
    html=`<div class="qprompt"><span class="qtype">철자를 써봐 (대소문자 상관없음)</span><div class="meaning" style="font-size:24px">${esc(x.m)}</div><div class="pron"><button class="spk sm" data-say="${esc(readText(x))}" aria-label="발음 듣기">${SPK}</button><span style="font-size:15px">${esc(x.p)}</span></div></div><form class="spell" id="sf"><input id="sp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="영어로 입력"><button class="btn" style="background:var(--cyan);color:#06122A">확인</button></form>`;
  }
  host.innerHTML=`<div class="qbox">${html}<div id="fb"></div></div>`;bindSay(host);
  const feedback=ok=>{
    onAns(ok);
    const fb=host.querySelector("#fb");
    if(ok){fb.innerHTML=`<div class="fb good"><b>정답!</b><span class="term" style="font-size:17px">${esc(x.t)} = ${esc(x.m)}</span></div>`;setTimeout(onNext,isWord(x)&&type==="spell"?900:700)}
    else{fb.innerHTML=`<div class="fb bad"><b>아깝다! 정답은</b><div class="term" style="font-size:20px">${esc(x.t)}</div><div>${esc(x.p)} · ${esc(x.m)}</div>${partsHTML(x.d)}</div><button class="big alt" id="nx" style="margin-top:12px">다음</button>`;fb.querySelector("#nx").onclick=onNext;fb.scrollIntoView({behavior:RM?"auto":"smooth",block:"nearest"})}
  };
  if(type==="spell"){
    const inp=host.querySelector("#sp");setTimeout(()=>inp.focus(),100);
    host.querySelector("#sf").onsubmit=e=>{e.preventDefault();if(!inp.value.trim()||inp.disabled)return;const v=norm(inp.value),main=norm(x.t.replace(/\(.*?\)/g,"")),ab=(x.t.match(/\((.*?)\)/)||[])[1];const ok=v===main||(ab&&v===norm(ab));inp.disabled=true;inp.classList.add(ok?"right":"wrong");feedback(ok)};
  }else{
    host.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=b.dataset.v===x.t;host.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(o.dataset.v===x.t)o.classList.add("right")});if(!ok)b.classList.add("wrong");feedback(ok)});
  }
}

function addXP(g){const before=lvlOf(S.xp);S.xp+=g;if(sess)sess.xp+=g;if(lvlOf(S.xp)>before){setTimeout(()=>{sfx.up();confetti();toast("레벨 업! Lv."+lvlOf(S.xp))},250)}}
function onAnswer(it,ok){
  const first=!sess.firsts.has(it.t);sess.total++;
  if(first){sess.firsts.add(it.t);
    let w=S.words[it.t];if(!w){w=S.words[it.t]={b:0,due:today(),c:0,w:0,f:today()};S.day.newDone++}else S.day.revDone++;
    const prev=w.b;if(ok){w.c++;w.b=Math.min(w.b+1,6)}else{w.w++;w.b=0}w.due=today()+IV[w.b];
    if(prev<MASTER&&w.b>=MASTER)setTimeout(()=>toast("마스터! "+it.t),900);
  }
  const c=$("#combo");
  if(ok){sess.right++;sess.combo++;sess.max=Math.max(sess.max,sess.combo);sfx.ok();flash("var(--good)");addXP(10+Math.min(sess.combo-1,10)*2);if(c){c.textContent=sess.combo>1?"x"+sess.combo:"";c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop")}}
  else{sess.combo=0;sfx.bad();flash("var(--bad)");if(c)c.textContent="";if(!sess.retried.has(it.t)){sess.retried.add(it.t);sess.q.push({k:"q",t:it.t,type:"meaning"})}}
  save();
}

function markDayDone(){
  if(S.day.done)return false;
  if(S.day.newDone>0||nextNew(1).length===0){S.day.done=true;const t=today();S.streak=S.lastDone===t-1?S.streak+1:(S.lastDone===t?S.streak:1);S.lastDone=t;addXP(20);return true}
  return false;
}
function finish(quit){
  const newly=markDayDone();
  const L=learned(),got=MILES.filter(m=>m>sess.L0&&m<=L);got.forEach(m=>{if(!S.badges.includes(m))S.badges.push(m)});save();
  if(quit&&sess.total===0){sess=null;closeOv();return}
  const rate=sess.total?Math.round(sess.right/sess.total*100):0;
  $("#ovin").innerHTML=`<div class="result">
    <div class="label">${newly?"오늘의 처방 완료":"라운드 종료"}</div>
    <h2>${rate>=90?"완벽해!":rate>=70?"잘했어!":"내일 또 보자!"}</h2>
    ${newly?`<div style="font-family:var(--f-term);font-weight:800;font-size:44px;color:var(--gold)" class="num">${S.streak}일</div><div class="muted">연속 학습 중</div>`:""}
    <div class="rgrid"><div class="stat"><span class="v num">${rate}%</span><span class="k">정답률</span></div><div class="stat"><span class="v num">x${sess.max}</span><span class="k">최대 콤보</span></div><div class="stat"><span class="v num" style="color:var(--gold)">+${sess.xp}</span><span class="k">XP</span></div></div>
    ${got.length?`<div class="card" style="width:100%;align-items:center"><div class="badge got" style="width:72px;height:72px;font-size:22px">${got[got.length-1]}</div><b>${got[got.length-1]}단어 배지 획득!</b><span class="muted" style="font-size:13px">아빠한테 보여주고 보상 받기</span></div>`:""}
    <button class="big" id="home" style="margin-top:8px">홈으로</button></div>`;
  if(newly||got.length){sfx.up();confetti()}
  $("#home").onclick=()=>{sess=null;closeOv()};
}

/* ===================== 보스전 ===================== */
let boss=null;
function startBoss(){
  const bi=bossInfo(),seen=Object.entries(S.words).map(([k,w])=>({x:BY[k],w})).filter(o=>o.x);
  const recent=shuffle(seen.filter(o=>o.w.f>=bi.wk-7)),rest=shuffle(seen.filter(o=>o.w.f<bi.wk-7));
  const picks=recent.concat(rest).slice(0,10).map(o=>o.x);
  const qs=picks.map(x=>({x,type:shuffle(isWord(x)?["meaning","term","spell"]:["meaning","term"])[0]}));
  boss={qs,i:0,hp:qs.length,max:qs.length,hearts:3,name:bi.name,wk:bi.wk};
  openOv();bossStep();
}
function bossStep(dmg){
  const b=boss,host=$("#ovin");
  if(b.hp<=0||b.hearts<=0||b.i>=b.qs.length)return bossEnd();
  host.innerHTML=`<div class="ov-top"><button class="x" id="quit" aria-label="도망가기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div style="flex:1"></div><div class="hearts">${[0,1,2].map(i=>`<span class="${i<b.hearts?"":"lost"}">${HEART}</span>`).join("")}</div></div>
  <div class="arena"><div class="bossname">${esc(b.name)}</div><div class="hp"><i style="width:${b.hp/b.max*100}%"></i></div><div class="bossart ${dmg?"hit":""}" id="ba">${virus(120,"#FF4F8B")}</div>${dmg?'<div class="dmg">-1</div>':""}<span class="muted num" style="font-size:13px">HP ${b.hp}/${b.max}</span></div><div id="qh"></div>`;
  $("#quit").onclick=()=>{boss=null;closeOv()};
  const it=b.qs[b.i];
  ask($("#qh"),it.x,it.type,ok=>{if(ok){b.hp--;sfx.hit()}else{b.hearts--;sfx.bad();flash("var(--bad)")}it.ok=ok},()=>{b.i++;bossStep(it.ok)});
}
function bossEnd(){
  const b=boss,won=b.hp<=0;
  if(won){S.boss[b.wk]={won:true,hearts:b.hearts};addXP(100+b.hearts*20);save()}
  $("#ovin").innerHTML=`<div class="result"><div style="opacity:${won?.3:1};filter:${won?"grayscale(1)":"none"}">${virus(110,"#FF4F8B")}</div>
  <div class="label">주말 보스전</div><h2>${won?"보스 처치!":"보스가 도망쳤다..."}</h2>
  <p class="muted" style="margin:0">${won?`+${100+b.hearts*20} XP · 남은 하트 ${b.hearts}개`:"틀린 단어를 복습하고 다시 도전해봐. 이번 주말 안에 몇 번이든 가능!"}</p>
  <button class="big" id="home">홈으로</button></div>`;
  if(won){sfx.up();confetti()}
  $("#home").onclick=()=>{boss=null;closeOv()};
}

/* ===================== 월드맵 ===================== */
function renderMap(){
  const cur=(nextNew(1)[0]||{w:WORLDS.length-1}).w;let stage="";
  $("#app").innerHTML=`<div class="top"><h1>월드맵</h1></div><p class="muted" style="margin:0">워밍업에서 조각을 모으고, 1학년 월드에서 진짜 단어를 깨요.</p>`+
  WORLDS.map((w,wi)=>{const tot=w.items.length,seen=w.items.filter(a=>S.words[a[0]]).length,mas=w.items.filter(a=>(S.words[a[0]]||{}).b>=MASTER).length,locked=wi>cur;
    const h=w.stage!==stage?`<div class="label stage-h">${esc(stage=w.stage)}</div>`:"";
    return h+`<button class="world ${locked?"locked":""} ${wi===cur?"current":""}" data-w="${wi}"><span class="orb" style="background:${w.color}">${esc(w.tag)}</span><div style="flex:1;min-width:0"><div class="row" style="gap:8px"><b style="font-size:16px">${esc(w.name)}</b>${wi===cur?'<span class="pill on">진행 중</span>':locked?'<span class="pill">잠김</span>':seen===tot?'<span class="pill ok">클리어</span>':""}</div><div class="muted" style="font-size:13px">${esc(w.desc)} · 배운 ${seen}/${tot} · 익힌 ${mas}</div><div class="bar"><i style="width:${seen/tot*100}%;background:${w.color}"></i></div></div></button>`}).join("")+
  `<div class="card"><div class="label">다음 업데이트</div><span class="muted" style="font-size:14px">신경 · 비뇨 · 내분비 · 생식 · 피부 월드, 2학년 질환 · 약리, 3학년 처방 약어, 4학년 국시 대비</span></div>`;
  document.querySelectorAll(".world").forEach(b=>b.onclick=()=>{const wi=+b.dataset.w;if(wi>cur){toast("앞 월드를 먼저 진행해야 열려요");return}openWorld(wi)});
}
function openWorld(wi){
  const w=WORLDS[wi];openOv();
  $("#ovin").innerHTML=`<div class="ov-top"><button class="x" id="back" aria-label="닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><h2 style="font-size:22px">${esc(w.name)}</h2></div>
  <p class="muted" style="margin:0;font-size:13px">점 5개가 다 차면 완전히 익힌 단어예요. 배운 단어를 누르면 발음이 나와요.</p>
  <div class="wlist">${w.items.map(a=>{const s=S.words[a[0]],x=BY[a[0]];if(!s)return`<div class="witem"><span class="term muted">???</span><span class="muted" style="font-size:13px">아직 안 배움</span></div>`;const f=Math.min(s.b,5);return`<button class="witem" data-say="${esc(readText(x))}" style="width:100%;text-align:left"><div style="min-width:0"><div class="term">${esc(a[0])}</div><div class="muted" style="font-size:13px">${esc(a[1])} · ${esc(a[2])}</div></div><div class="dots" aria-label="숙련도 ${f}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=f?"f":""}"></i>`).join("")}</div></button>`}).join("")}</div>`;
  bindSay($("#ovin"));$("#back").onclick=closeOv;
}

/* ===================== 단어장 ===================== */
let bookF="all",bookQ="",bookOpen=null;
const BF=[["all","전체"],["weak","약한 단어"],["learning","익히는 중"],["master","익힌 단어"]];
function bookList(){
  const q=bookQ.trim().toLowerCase();
  return Object.entries(S.words).filter(([k])=>BY[k]).map(([k,w])=>({x:BY[k],w}))
    .filter(o=>bookF==="all"||(bookF==="master"&&o.w.b>=MASTER)||(bookF==="learning"&&o.w.b<MASTER)||(bookF==="weak"&&o.w.w>0&&o.w.b<MASTER))
    .filter(o=>!q||o.x.t.toLowerCase().includes(q)||o.x.m.includes(q)||o.x.p.includes(q))
    .sort((a,b)=>b.w.f-a.w.f||ALL.indexOf(b.x)-ALL.indexOf(a.x));
}
function renderBook(){
  $("#app").innerHTML=`<div class="top"><h1>단어장</h1><span class="muted num" style="font-size:14px">${learned()}개</span></div>
  <input class="search" id="bq" type="search" placeholder="영어, 뜻, 발음으로 찾기" value="${esc(bookQ)}" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="filters">${BF.map(([k,l])=>`<button data-f="${k}" aria-pressed="${bookF===k}">${l}</button>`).join("")}</div>
  <div id="bpr"></div><div id="blist" class="wlist"></div>`;
  $("#bq").oninput=e=>{bookQ=e.target.value;bookBody()};
  document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{bookF=b.dataset.f;bookOpen=null;renderBook()});
  bookBody();
}
function bookBody(){
  const list=bookList(),host=$("#blist");
  $("#bpr").innerHTML=list.length>=4?`<button class="big alt" id="prac">이 목록으로 연습하기 (${Math.min(list.length,10)}문제)</button>`:"";
  if($("#prac"))$("#prac").onclick=()=>startPractice(list.map(o=>o.x));
  if(!list.length){host.innerHTML=`<div class="empty">${learned()?(bookQ?"찾는 단어가 없어요":bookF==="weak"?"틀린 적 있는 단어가 없어요. 잘하고 있어!":"이 칸에 해당하는 단어가 아직 없어요"):"아직 배운 단어가 없어요.<br>오늘 탭에서 첫 단어를 배워보세요!"}</div>`;return}
  host.innerHTML=list.map(({x,w})=>{const f=Math.min(w.b,5),open=bookOpen===x.t;return`<div class="bitem">
    <button class="bhead" data-t="${esc(x.t)}" aria-expanded="${open}"><div><div class="term" style="font-size:16px">${esc(x.t)}</div><div class="muted" style="font-size:13px">${esc(x.p)} · ${esc(x.m)}</div></div><div class="dots" aria-label="숙련도 ${f}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=f?"f":""}"></i>`).join("")}</div></button>
    ${open?`<div class="bbody"><div class="pron"><button class="spk" data-say="${esc(readText(x))}" aria-label="발음 듣기">${SPK}</button><span>${esc(x.p)}</span></div><div class="meaning" style="font-size:19px">${esc(x.m)}</div>${partsHTML(x.d)}${exHTML(x)}<span class="muted" style="font-size:12px">${WORLDS[x.w].name} · 맞힘 ${w.c} · 틀림 ${w.w} · ${w.due<=today()?"오늘 복습":`${w.due-today()}일 뒤 복습`}</span></div>`:""}</div>`}).join("");
  host.querySelectorAll(".bhead").forEach(b=>b.onclick=()=>{bookOpen=bookOpen===b.dataset.t?null:b.dataset.t;bookBody();if(bookOpen){const x=BY[bookOpen];speak(readText(x))}});
  bindSay(host);
}

/* 자유 연습: 복습 일정에는 영향 없음 */
let prac=null;
function startPractice(words){
  const qs=shuffle(words).slice(0,10).map(x=>({x,type:shuffle(isWord(x)?["meaning","term","spell"]:["meaning","term"])[0]}));
  prac={qs,i:0,right:0,combo:0,max:0,xp:0};openOv();pracStep();
}
function pracStep(){
  const p=prac,host=$("#ovin");
  if(p.i>=p.qs.length){
    const rate=Math.round(p.right/p.qs.length*100);
    host.innerHTML=`<div class="result"><div class="label">자유 연습</div><h2>${rate>=90?"완벽해!":rate>=70?"잘했어!":"한 번 더 해보자!"}</h2><div class="rgrid"><div class="stat"><span class="v num">${rate}%</span><span class="k">정답률</span></div><div class="stat"><span class="v num">x${p.max}</span><span class="k">최대 콤보</span></div><div class="stat"><span class="v num" style="color:var(--gold)">+${p.xp}</span><span class="k">XP</span></div></div><p class="muted" style="margin:0;font-size:13px">자유 연습은 복습 일정을 바꾸지 않아요.</p><button class="big" id="again">한 번 더</button><button class="big alt" id="home">단어장으로</button></div>`;
    if(rate>=90){sfx.up();confetti()}
    $("#again").onclick=()=>startPractice(p.qs.map(q=>q.x));
    $("#home").onclick=()=>{prac=null;closeOv()};return;
  }
  const pct=Math.round(p.i/p.qs.length*100),it=p.qs[p.i];
  host.innerHTML=`<div class="ov-top"><button class="x" id="quit" aria-label="그만하기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="prog"><i style="width:${pct}%"></i></div><div class="combo num" id="combo">${p.combo>1?"x"+p.combo:""}</div></div><div id="qh"></div>`;
  $("#quit").onclick=()=>{prac=null;closeOv()};
  ask($("#qh"),it.x,it.type,ok=>{const c=$("#combo");if(ok){p.right++;p.combo++;p.max=Math.max(p.max,p.combo);p.xp+=5;S.xp+=5;save();sfx.ok();flash("var(--good)");if(c){c.textContent=p.combo>1?"x"+p.combo:"";c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop")}}else{p.combo=0;sfx.bad();flash("var(--bad)");if(c)c.textContent=""}},()=>{p.i++;pracStep()});
}

/* ===================== 설정 ===================== */
let resetArm=false;
function code(){return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function renderSet(){
  $("#app").innerHTML=`<div class="top"><h1>설정</h1></div>
  <div class="card"><div class="label">하루 새 단어 수</div><div class="seg">${[1,2,3,5].map(n=>`<button aria-pressed="${S.daily===n}" data-n="${n}">${n}</button>`).join("")}</div><span class="muted" style="font-size:13px">복습은 따로 나와요. 처음 2주는 1개로 습관부터 잡는 걸 추천!</span></div>
  <div class="card"><div class="row"><div><b>효과음</b><div class="muted" style="font-size:13px">정답 · 콤보 · 레벨업 소리</div></div><button class="toggle" id="snd" aria-pressed="${S.sound}" aria-label="효과음"></button></div></div>
  <div class="card" id="bk"><div class="label">진도 백업</div><span style="font-size:14px">아래 코드를 복사해서 메모 앱에 붙여두세요. 폰을 바꾸면 '복원'에 붙여넣으면 돼요.</span><textarea id="bkc" readonly>${code()}</textarea><button class="btn" id="cp">코드 복사</button>
  <div class="label" style="margin-top:8px">복원</div><textarea id="rs" placeholder="백업 코드를 붙여넣으세요"></textarea><button class="btn" id="rsb">복원하기</button></div>
  <div class="card"><div class="label">홈 화면에 앱으로 추가</div><b style="font-size:14px">아이폰 (사파리)</b><ol class="how"><li>아래쪽 <b>공유 버튼</b>(네모에 화살표) 누르기</li><li><b>홈 화면에 추가</b> 선택</li></ol><b style="font-size:14px">안드로이드 (크롬)</b><ol class="how"><li>오른쪽 위 <b>⋮</b> 누르기</li><li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b> 선택</li></ol><span class="muted" style="font-size:13px">아이폰은 홈 화면 아이콘과 사파리의 기록이 따로 저장돼요. 추가한 뒤에는 꼭 아이콘으로만 여세요.</span></div>
  <div class="card"><div class="label">초기화</div><button class="btn warn" id="rst">${resetArm?"정말 지울까요? 한 번 더 누르면 전부 삭제":"모든 기록 지우기"}</button></div>
  <p class="muted" style="font-size:12px;margin:0">단어 ${ALL.length}개 · 기록은 이 폰에만 저장돼요</p>`;
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.daily=+b.dataset.n;save();renderSet();toast(`하루 새 단어 ${S.daily}개로 바꿨어요`)});
  $("#snd").onclick=()=>{S.sound=!S.sound;save();renderSet()};
  $("#cp").onclick=async()=>{const t=$("#bkc");try{await navigator.clipboard.writeText(t.value);toast("복사했어요. 메모 앱에 붙여두세요")}catch(e){t.focus();t.select();toast("코드를 길게 눌러 복사하세요")}S.lastBackup=today();save()};
  $("#rsb").onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($("#rs").value.trim()))));if(!o||typeof o.words!=="object")throw 0;S=Object.assign(fresh(),o);S.lastBackup=today();save();toast("복원 완료! 배운 단어 "+learned()+"개");tab="home";render()}catch(e){toast("코드가 올바르지 않아요. 전체를 빠짐없이 붙여넣었는지 확인하세요",2600)}};
  $("#rst").onclick=()=>{if(!resetArm){resetArm=true;renderSet();setTimeout(()=>{resetArm=false;if(tab==="set")renderSet()},4000);return}resetArm=false;S=fresh();save();toast("초기화했어요");tab="home";render()};
}

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&$("#ov").hidden)render()});
render();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
</html>
